server {
  listen 5184;
  server_name _;

  location = /healthz {
    add_header Content-Type application/json;
    return 200 '{"status":"ok"}';
  }

  location = /standalone/s_tts {
    return 301 /standalone/s_tts/;
  }

  location = /standalone/s_tts/custom_voice_files {
    return 301 /standalone/s_tts/custom_voice_files/;
  }

  location /standalone/s_tts/custom_voice_files/ {
    alias /data/custom_voice_files/;
    autoindex off;
    add_header Cache-Control "public, max-age=3600";
    client_max_body_size 30m;
    dav_methods PUT DELETE;
    create_full_put_path on;
    dav_access user:rw group:rw all:r;
  }

  location = /standalone/s_tts/config {
    return 301 /standalone/s_tts/config/;
  }

  location /standalone/s_tts/config/ {
    alias /data/config/;
    autoindex off;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # API Manager execute routes used by this standalone app.
  location /api_manager/api/v1/execute/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://127.0.0.1:3051/api/v1/execute/;
  }

  location /standalone/s_tts/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /standalone/s_tts/index.html;
  }
}
