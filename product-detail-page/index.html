<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI详情页设计 | Modern Luxury</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: #f0f2f5;
        background-image: 
          radial-gradient(at 0% 0%, hsla(253, 50%, 90%, 0.6) 0, transparent 50%), 
          radial-gradient(at 50% 0%, hsla(225, 60%, 85%, 0.6) 0, transparent 50%), 
          radial-gradient(at 100% 0%, hsla(339, 70%, 90%, 0.6) 0, transparent 50%);
        background-attachment: fixed;
        background-size: cover;
        color: #1a1a1a;
      }
      /* Custom Scrollbar for modern glass effect */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.1);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 0, 0, 0.2);
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 25px 50px -12px rgba(173, 216, 230, 0.2);
      }

      @keyframes scan {
        0% { top: 0; opacity: 0.1; }
        50% { top: 100%; opacity: 1; }
        100% { top: 0; opacity: 0.1; }
      }

      .animate-scan {
        animation: scan 2s ease-in-out infinite;
      }
    </style>
</head>
  <body class="text-slate-900 antialiased h-full overflow-hidden selection:bg-blue-500 selection:text-white flex flex-col">
    <div id="root" class="flex-1"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
